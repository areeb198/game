name: Build debug APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    # A wedged build should not burn the whole 6 hour default allowance.
    timeout-minutes: 120
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      # A wrong buildozer.spec only surfaces deep inside p4a, ~40 minutes in.
      # Catch misconfiguration here instead: pygame-ce recipe present, its
      # site_packages_name intact, and p4a.local_recipes actually enabled.
      - name: Verify packaging configuration (fail fast)
        run: python3 .github/scripts/verify_packaging.py

      - name: Build debug APK with Buildozer
        run: buildozer -v android debug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: skystrikers-debug-apk
          path: bin/*.apk
          retention-days: 30
