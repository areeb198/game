name: Build debug APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Cache Buildozer global & project directories
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: bzr-docker-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: bzr-docker-${{ runner.os }}-

      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: skystrikers-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 30
