name: Build signed release APK / AAB

# Produces a *signed* build for distribution (sideloading outside your own
# devices, or uploading to Google Play).
#
# ONE-TIME SETUP in the repository (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#
#   KEYSTORE_BASE64       the keystore file, base64 encoded (see below)
#   KEYSTORE_PASSWORD     password you chose for the keystore
#   KEY_ALIAS             key alias, e.g. "skystrikers"
#   KEY_ALIAS_PASSWORD    password for that alias
#
# buildozer reads no android.keystore* key from buildozer.spec: it passes --sign
# only when P4A_RELEASE_KEYSTORE, P4A_RELEASE_KEYSTORE_PASSWD, P4A_RELEASE_KEYALIAS
# and P4A_RELEASE_KEYALIAS_PASSWD are exported, which the build steps below do.
#
# Create the keystore once, on any machine:
#
#   keytool -genkey -v -keystore skystrikers.keystore \
#           -alias skystrikers -keyalg RSA -keysize 2048 -validity 10000
#
#   # Linux / macOS / WSL / Git Bash
#   base64 -w0 skystrikers.keystore > keystore.b64
#   # PowerShell
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("skystrikers.keystore")) > keystore.b64
#
#   Get-Content keystore.b64 -Raw | Set-Clipboard     # paste into the secret
#
#   Back the keystore file up somewhere safe. Lose it and you can never update
#   the app on the Play Store again.
#
# THEN: push a tag matching v* to trigger this workflow.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The signed APK and the Play Store .aab are attached to the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      aab:
        description: "Also build an App Bundle (.aab) for Google Play"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      # Runs before the 2 hour build so a misconfigured spec fails in seconds.
      - name: Verify packaging configuration (fail fast)
        run: python3 .github/scripts/verify_packaging.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            build-essential autoconf automake libtool pkg-config cmake ccache \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libtinfo5 patch gettext
          java -version

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install buildozer cython virtualenv

      - name: Cache the Android SDK / NDK / compiled Python
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: bzr-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: bzr-v3-${{ runner.os }}-

      - name: Decode the upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/skystrikers.keystore"
          keytool -list -keystore "$HOME/skystrikers.keystore" -storepass "$KS_PASS" >/dev/null

      # p4a reuses any cached dist whose requirements/bootstrap/arch match and
      # never re-checks android.api, so a cache restored after raising it would
      # keep shipping the old targetSdkVersion - which Play rejects.
      - name: Drop a dist rendered for a different targetSdk
        shell: bash
        run: python3 .github/scripts/drop_stale_dist.py

      - name: Build the signed APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: |
          # buildozer reads nothing from android.keystore in the spec; it only
          # passes --sign when these four P4A_RELEASE_* variables are present.
          export P4A_RELEASE_KEYSTORE="$HOME/skystrikers.keystore"
          export P4A_RELEASE_KEYSTORE_PASSWD="$KS_PASS"
          export P4A_RELEASE_KEYALIAS="$ALIAS"
          export P4A_RELEASE_KEYALIAS_PASSWD="$ALIAS_PASS"
          buildozer -v android release

      - name: Build the App Bundle for Google Play
        if: ${{ github.event_name == 'push' || inputs.aab }}
        shell: bash
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: |
          export P4A_RELEASE_KEYSTORE="$HOME/skystrikers.keystore"
          export P4A_RELEASE_KEYSTORE_PASSWD="$KS_PASS"
          export P4A_RELEASE_KEYALIAS="$ALIAS"
          export P4A_RELEASE_KEYALIAS_PASSWD="$ALIAS_PASS"
          sed -i 's/^android.release_artifact = apk/android.release_artifact = aab/' buildozer.spec
          buildozer -v android release

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp bin/*.apk out/ 2>/dev/null || true
          cp bin/*.aab out/ 2>/dev/null || true
          ls -lh out/
          test -n "$(ls -A out 2>/dev/null)" || { echo "::error::nothing was built"; exit 1; }
          sha256sum out/* > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      # buildozer exits 0 even when it could not sign, so an unsigned artifact
      # would otherwise be shipped as a successful release.
      - name: Verify the artifacts are signed
        shell: bash
        run: |
          python3 .github/scripts/verify_signed_artifacts.py out
          # buildozer keeps the SDK in ~/.buildozer, the build tree in ./.buildozer
          APKSIGNER=""
          for root in "$HOME/.buildozer" "$PWD/.buildozer"; do
            if [ ! -d "$root" ]; then continue; fi
            APKSIGNER="$(find "$root" -type f -name apksigner -path '*build-tools*' -print -quit 2>/dev/null)"
            if [ -n "$APKSIGNER" ]; then break; fi
          done
          test -n "$APKSIGNER" || { echo "::error::apksigner not found in the Android SDK"; exit 1; }
          echo "apksigner: $APKSIGNER"
          for apk in out/*.apk; do
            echo "== apksigner verify $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      # Play reads the built manifest, not buildozer.spec. An upload whose
      # targetSdkVersion is below the current floor is rejected at submission,
      # so prove the value that Gradle actually stamped onto the artifact.
      - name: Verify the APK is acceptable to Google Play
        shell: bash
        run: python3 .github/scripts/verify_play_ready_artifact.py out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skystrikers-release
          path: out/*
          if-no-files-found: error
          retention-days: 90

      - name: Attach to the GitHub release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.aab
            out/SHA256SUMS.txt
          generate_release_notes: true
